<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f3f1ec">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="M♡T Console">
<title>M♡T Console</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;600;700&family=Noto+Kufi+Arabic:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f1ec;--card:#fff;--ink:#15171a;--mute:#6b6f76;--line:#e4e1da;--soft:#ebe8e1;--gold:#e0a93b;--gold-d:#a8741a;
--trial:#c98a12;--trial-bg:#fbf1dc;--paid:#0f8a5f;--paid-bg:#dff3ea;--exp:#7c828b;--exp-bg:#eceef1;--blk:#c2412d;--blk-bg:#f8e3df;
--sh:0 1px 2px rgba(20,20,20,.05),0 6px 18px rgba(20,20,20,.05)}
:root.dark{--bg:#0f1114;--card:#171a1f;--ink:#f1eee8;--mute:#9aa0a8;--line:#262a31;--soft:#1f2329;
--trial-bg:#2d2413;--paid-bg:#0f2a20;--exp-bg:#22262c;--blk-bg:#33191486;--sh:0 1px 2px rgba(0,0,0,.4)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 "Noto Kufi Arabic",system-ui,sans-serif;overflow:hidden}
button,input{font:inherit;color:inherit}
.lat{font-family:Montserrat,system-ui,sans-serif}
.mono{font-family:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;letter-spacing:.02em}
.app{display:grid;grid-template-rows:auto auto auto 1fr;height:100%;max-width:720px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 10px}
.mk{display:flex;direction:ltr;align-items:center;gap:1px;font:700 20px/1 Montserrat,sans-serif;letter-spacing:.02em}
.mk svg{width:20px;height:20px;color:var(--gold);margin:0 1px}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:2px;flex:1}
.brand small{font:500 9px/1 Montserrat,sans-serif;letter-spacing:.38em;color:var(--mute)}
.ib{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer}
.ib svg{width:19px;height:19px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:4px 16px 10px}
.st{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px 8px;text-align:center;cursor:pointer;box-shadow:var(--sh);transition:border-color .15s}
.st b{display:block;font:700 22px/1.1 Montserrat,sans-serif}
.st span{font-size:11px;color:var(--mute)}
.st.on{border-color:currentColor}
.st[data-g=trial]{color:var(--trial)}.st[data-g=paid]{color:var(--paid)}.st[data-g=expired]{color:var(--exp)}.st[data-g=blocked]{color:var(--blk)}
.st span{color:var(--mute)}
.bar{display:flex;gap:8px;padding:0 16px 10px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:12px;padding:3px;flex:none;width:168px}
.seg button{border:0;background:none;border-radius:9px;height:38px;font-size:13px;font-weight:500;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.search{flex:1;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 12px;font-size:16px;outline:none;direction:ltr;text-align:right}
.search:focus{border-color:var(--gold)}
.list{overflow-y:auto;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 90px);overscroll-behavior:contain}
.gh{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);margin:14px 2px 8px}
.gh i{flex:1;height:1px;background:var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:var(--sh);cursor:pointer}
.row{display:flex;align-items:center;gap:8px}
.nm{font-weight:700;font-size:14px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.g-trial .pill{color:var(--trial);background:var(--trial-bg)}.g-paid .pill{color:var(--paid);background:var(--paid-bg)}
.g-expired .pill{color:var(--exp);background:var(--exp-bg)}.g-blocked .pill{color:var(--blk);background:var(--blk-bg)}
.new{font:700 9px/1 Montserrat,sans-serif;letter-spacing:.14em;color:#fff;background:var(--gold-d);padding:4px 6px;border-radius:6px}
.ids{display:grid;gap:6px;margin-top:12px}
.idb{display:flex;align-items:center;gap:10px;border:1px dashed var(--line);border-radius:10px;padding:8px 10px;direction:ltr;cursor:copy}
.idb small{flex:none;width:92px;font:500 9px/1.2 Montserrat,sans-serif;letter-spacing:.16em;color:var(--mute)}
.idb div{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:4px;border-radius:4px;background:var(--soft);margin-top:12px;overflow:hidden}
.prog i{display:block;height:100%;border-radius:4px}
.g-trial .prog i{background:var(--trial)}.g-paid .prog i{background:var(--paid)}.vip{font:700 10px/1 Montserrat,sans-serif;letter-spacing:.12em}
.meta{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-top:8px}
.empty{text-align:center;color:var(--mute);padding:48px 0;font-size:13px}
.sk{height:132px;border-radius:16px;background:linear-gradient(90deg,var(--soft),var(--card),var(--soft));background-size:200% 100%;animation:sk 1.2s infinite linear;margin-bottom:10px}
@keyframes sk{to{background-position:-200% 0}}
.code-st{font-size:11px;font-weight:700}
.st-UNUSED{color:var(--trial)}.st-REDEEMED{color:var(--paid)}.st-REVOKED{color:var(--exp)}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);height:52px;padding:0 26px;border-radius:999px;border:0;background:var(--ink);color:var(--bg);font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.18);cursor:pointer;display:none}
.fab.show{display:block}
.btn{height:48px;border-radius:12px;border:0;background:var(--ink);color:var(--bg);font-weight:700;padding:0 18px;cursor:pointer;white-space:nowrap}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.red{background:var(--blk);color:#fff}
.btn:disabled{opacity:.5}
.in{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:16px;outline:none;width:100%;text-align:center}
.in:focus{border-color:var(--gold)}
.chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.chip{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);font:600 13px Montserrat,sans-serif;cursor:pointer}
.chip.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.scrim{position:fixed;inset:0;background:rgba(10,10,12,.42);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:720px;margin:0 auto;max-height:88%;overflow-y:auto;background:var(--card);border-radius:22px 22px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
.sec{border-top:1px solid var(--line);padding:14px 0;display:grid;gap:10px}
.sec h4{margin:0;font-size:13px;color:var(--mute);font-weight:500}
.pair{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.out{border:1px solid var(--gold);background:var(--trial-bg);border-radius:14px;padding:14px;text-align:center;direction:ltr;cursor:copy}
.out b{display:block;font-size:20px;letter-spacing:.06em}
.out small{font-size:11px;color:var(--mute)}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translate(-50%,-140%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;transition:transform .2s;z-index:9;white-space:nowrap}
.toast.on{transform:translate(-50%,0)}
.login{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;padding:24px;z-index:5}
.login .box{width:100%;max-width:340px;display:grid;gap:14px;text-align:center}
.login .mk{justify-content:center;font-size:44px}
.login .mk svg{width:44px;height:44px}
.login small{font:300 11px/1 Montserrat,sans-serif;letter-spacing:.5em;color:var(--mute);margin-bottom:22px}
.hide{display:none!important}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><symbol id="h" viewBox="0 0 256 256"><path fill="currentColor" d="M178,40c-20.65,0-38.73,8.88-50,23.89C116.73,48.88,98.65,40,78,40a62.07,62.07,0,0,0-62,62c0,70,103.79,126.66,108.21,129a8,8,0,0,0,7.58,0C136.21,228.66,240,172,240,102A62.07,62.07,0,0,0,178,40ZM128,214.8C109.74,204.16,32,155.69,32,102A46.06,46.06,0,0,1,78,56c19.45,0,35.78,10.36,42.6,27a8,8,0,0,0,14.8,0c6.82-16.67,23.15-27,42.6-27a46.06,46.06,0,0,1,46,46C224,155.61,146.24,204.15,128,214.8Z"/></symbol></svg>

<div class="login" id="login">
  <div class="box">
    <div class="mk">M<svg><use href="#h"/></svg>T</div>
    <small>CONSOLE</small>
    <input class="in mono" id="key" type="password" autocomplete="current-password" placeholder="ADMIN KEY" dir="ltr">
    <input class="in mono hide" id="tok" type="password" autocomplete="off" placeholder="API TOKEN" dir="ltr">
    <button class="btn" id="enter">دخول</button>
  </div>
</div>

<div class="app" id="app">
  <header class="top">
    <div class="brand"><div class="mk">M<svg><use href="#h"/></svg>T</div><small>CONSOLE</small></div>
    <button class="ib hide" id="install" aria-label="تثبيت" style="width:auto;padding:0 14px;font-weight:700;font-size:13px">تثبيت</button>
    <button class="ib" id="theme" aria-label="الوضع"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z"/></svg></button>
    <button class="ib" id="gear" aria-label="الإعدادات"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg></button>
  </header>
  <section class="stats" id="stats">
    <div class="st" data-g="trial"><b id="c-trial">–</b><span>تجربة</span></div>
    <div class="st" data-g="paid"><b id="c-paid">–</b><span>VIP</span></div>
    <div class="st" data-g="expired"><b id="c-expired">–</b><span>منتهي</span></div>
    <div class="st" data-g="blocked"><b id="c-blocked">–</b><span>محظور</span></div>
  </section>
  <div class="bar">
    <div class="seg"><button class="on" data-t="dev">الأجهزة</button><button data-t="codes">الأكواد</button></div>
    <input class="search mono" id="q" placeholder="ID" inputmode="search" autocomplete="off">
  </div>
  <main class="list" id="list"><div class="sk"></div><div class="sk"></div><div class="sk"></div></main>
</div>
<button class="fab" id="fab">إصدار كود</button>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
{
const $ = s => document.querySelector(s);
const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = { get(k){ try { return localStorage.getItem(k); } catch(e) { return null; } }, set(k,v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k,v); } catch(e) {} } };
const ERR = { ADMIN_UNAUTHORIZED:"المفتاح غير صحيح", SERVER_BUSY:"الخادم مشغول، أعد المحاولة", INVALID_CODE_DURATION:"مدة غير صالحة", INVALID_TRIAL_DAYS:"مدة غير صالحة", INVALID_EXTENSION_DAYS:"مدة غير صالحة", DEVICE_NOT_FOUND:"الجهاز غير موجود", CODE_ALREADY_REDEEMED:"الكود مستخدم", INVALID_DEVICE_ID:"رقم جهاز غير صالح" };
const GL = { trial:"تجربة", paid:"VIP", expired:"منتهي", blocked:"محظور" };
let key = store.get("mtk"), data = null, tab = "dev", filter = "", sel = null;

if (store.get("mtt") === "dark") document.documentElement.classList.add("dark");
$("#theme").onclick = () => { const d = document.documentElement.classList.toggle("dark"); store.set("mtt", d ? "dark" : "light"); };

function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 1800); }
function copy(t) {
  const done = () => toast("تم النسخ");
  const fb = () => { const a = document.createElement("textarea"); a.value = t; a.style.position = "fixed"; a.style.opacity = "0"; document.body.appendChild(a); a.select(); try { document.execCommand("copy"); done(); } catch(e) { toast(t); } a.remove(); };
  try { navigator.clipboard.writeText(t).then(done, fb); } catch(e) { fb(); }
}
const SERVER = "https://script.google.com/macros/s/AKfycbw9MjGgkhd0QIzdofk4Fn-uHju0UI8sYp5c0ewdedYSnEMQGWfP3TGu_JesDpSnHu5PSA/exec";
let mode = store.get("mtm") || "console", tok = store.get("mtk2");
async function post(body) {
  const r = await fetch(SERVER, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!j || j.ok === false) throw new Error((j && j.error) || "NETWORK");
  return j;
}
const ms = v => { if (!v) return 0; const t = typeof v === "number" ? v : Date.parse(v); return isNaN(t) ? 0 : t; };
const truthy = v => v === true || String(v).toUpperCase() === "TRUE" || String(v) === "1";
// Older server (before the console route): same data from admin_list_devices, grouped here.
function fromRow(d, now) {
  const blocked = truthy(d.Blocked) || String(d.Status).toUpperCase() === "BLOCKED";
  const permanent = truthy(d.Permanent);
  let trialEnd = ms(d.TrialEnd); const extra = Math.max(0, Number(d.ExtraDays) || 0);
  if (trialEnd && extra) trialEnd += extra * 86400000;
  const subEnd = ms(d.SubscriptionEnd);
  let group, end = 0;
  if (blocked) group = "blocked";
  else if (permanent || subEnd >= now) { group = "paid"; end = permanent ? 0 : subEnd; }
  else if (trialEnd >= now) { group = "trial"; end = trialEnd; }
  else group = "expired";
  return { id: String(d.DeviceId), name: String(d.DeviceName || ""), model: String(d.DeviceModel || ""), app: String(d.AppVersion || ""),
    group, permanent, end, daysLeft: end ? Math.max(0, Math.ceil((end - now) / 86400000)) : 0,
    created: ms(d.CreatedAt) || ms(d.FirstSeen), lastSync: ms(d.LastSync), reason: String(d.BlockReason || ""), activation: null };
}
function legacy(op, p) {
  const base = { token: tok, adminKey: key };
  if (op === "overview") return post(Object.assign({ action: "admin_list_devices" }, base)).then(r => {
    const now = Date.now();
    return { ok: true, legacy: true, now, defaultTrialDays: Number(store.get("mtd")) || 3, devices: (r.devices || []).map(d => fromRow(d, now)), codes: [] };
  });
  if (op === "create_code") return post(Object.assign({ action: "admin_create_code", deviceId: p.deviceId || "", durationDays: p.days, count: 1 }, base));
  if (op === "update_device") return post(Object.assign({ action: "admin_device_update" }, p, base));
  if (op === "revoke_code") return post(Object.assign({ action: "admin_revoke_code", codeId: p.codeId }, base));
  if (op === "set_default_trial") return post(Object.assign({ action: "admin_set_default_trial_days", trialDays: p.days }, base)).then(r => { store.set("mtd", String(p.days)); return r; });
  return Promise.reject(new Error("UNKNOWN_ACTION"));
}
function api(op, payload) {
  return mode === "legacy" ? legacy(op, payload || {}) : post({ action: "console", adminKey: key, op, payload: payload || {} });
}
function fail(e) {
  const m = String(e && e.message || e).replace(/^Error:\s*/, "");
  if (m.indexOf("ADMIN_UNAUTHORIZED") >= 0 || m === "UNAUTHORIZED") { store.set("mtk", null); store.set("mtk2", null); key = null; $("#login").classList.remove("hide"); }
  toast(ERR[m] || m);
}
const fmtId = id => esc(id).replace(/-/g, "\u2009\u2009");
const shortAct = a => a ? "ACT · " + esc(a.replace(/^ACT_/, "").slice(-8)) : "";
const dt = ms => ms ? "<bdi>" + new Date(ms).toLocaleDateString("en-GB", { day:"2-digit", month:"short" }) + "</bdi>" : "—";
const left = d => d.group === "paid" ? (d.permanent ? "دائم" : (d.daysLeft === 1 ? "يوم" : d.daysLeft === 2 ? "يومين" : d.daysLeft + " يوم"))
  : d.group === "trial" ? (d.daysLeft <= 1 ? "باقي يوم" : d.daysLeft === 2 ? "باقي يومين" : "باقي " + d.daysLeft + " أيام") : "";
const pill = d => d.group === "paid" ? '<bdi class="vip">VIP</bdi> · ' + (d.permanent ? "دائم" : "باقي " + left(d)) : esc(d.group === "trial" ? left(d) : GL[d.group]);

function devCard(d) {
  const isNew = data.now - d.created < 86400000;
  const pct = d.group === "trial" ? Math.min(100, d.daysLeft / Math.max(1, data.defaultTrialDays) * 100) : d.group === "paid" ? (d.permanent ? 100 : Math.min(100, d.daysLeft / 30 * 100)) : 0;
  return `<div class="card g-${d.group}" data-id="${esc(d.id)}">
    <div class="row"><div class="nm"><bdi>${esc(d.model || d.name || "Android")}</bdi></div>${isNew ? '<span class="new">NEW</span>' : ""}<span class="pill">${pill(d)}</span></div>
    <div class="ids">
      <div class="idb" data-c="${esc(d.id)}"><small>DEVICE</small><div class="mono">${fmtId(d.id)}</div></div>
      ${d.activation ? `<div class="idb" data-c="${esc(d.activation.activationId)}"><small>VERIFICATION</small><div class="mono">${shortAct(d.activation.activationId)}</div></div>` : ""}
    </div>
    ${pct ? `<div class="prog"><i style="width:${pct}%"></i></div>` : ""}
    <div class="meta"><span><bdi>${d.app ? "v" + esc(d.app) : ""}</bdi></span><span>${d.activation ? "وُثّق " + dt(d.activation.at) : "انضم " + dt(d.created)}</span></div>
  </div>`;
}
function codeCard(c) {
  return `<div class="card" style="cursor:default"><div class="row"><div class="nm mono" dir="ltr" style="text-align:right">${esc(c.codeId.replace(/^COD_/, "").slice(-10))}</div><span class="code-st st-${esc(c.status)}">${c.status === "UNUSED" ? "متاح" : c.status === "REDEEMED" ? "مستخدم" : "ملغى"}</span></div>
    <div class="meta"><span class="mono">${c.deviceId ? fmtId(c.deviceId) : "لأي جهاز"}</span><span>${c.days} يوم · ${dt(c.created)}</span></div>
    ${c.status === "UNUSED" ? `<div style="margin-top:10px"><button class="btn ghost" data-rv="${esc(c.codeId)}" style="height:40px;width:100%">إلغاء الكود</button></div>` : ""}</div>`;
}
function render() {
  if (!data) return;
  const cnt = { trial:0, paid:0, expired:0, blocked:0 };
  data.devices.forEach(d => cnt[d.group]++);
  Object.keys(cnt).forEach(g => $("#c-" + g).textContent = cnt[g]);
  document.querySelectorAll(".st").forEach(el => el.classList.toggle("on", el.dataset.g === filter));
  $("#fab").classList.toggle("show", tab === "codes");
  document.querySelector('.seg button[data-t="codes"]').classList.toggle("hide", !!data.legacy);
  const q = $("#q").value.trim().toUpperCase().replace(/[\s·-]/g, "");
  const L = $("#list");
  if (tab === "codes") {
    const cs = data.codes.filter(c => !q || (c.codeId + c.deviceId).toUpperCase().replace(/-/g, "").indexOf(q) >= 0);
    L.innerHTML = cs.length ? cs.map(codeCard).join("") : '<div class="empty">لا توجد أكواد</div>';
    return;
  }
  const order = ["trial", "paid", "expired", "blocked"];
  let html = "";
  order.filter(g => !filter || g === filter).forEach(g => {
    const ds = data.devices.filter(d => d.group === g && (!q || d.id.replace(/-/g, "").indexOf(q) >= 0 || (d.activation && d.activation.activationId.toUpperCase().indexOf(q) >= 0)))
      .sort((a, b) => g === "trial" ? a.daysLeft - b.daysLeft || b.created - a.created : b.created - a.created);
    if (ds.length) html += `<div class="gh"><span>${GL[g]}</span><span class="lat">${ds.length}</span><i></i></div>` + ds.map(devCard).join("");
  });
  L.innerHTML = html || '<div class="empty">لا توجد أجهزة</div>';
}
function load() {
  return api("overview").then(r => { data = r; render(); }, fail);
}

function openSheet(html) { $("#sheet").innerHTML = '<div class="grab"></div>' + html; $("#sheet").classList.add("on"); $("#scrim").classList.add("on"); }
function closeSheet() { $("#sheet").classList.remove("on"); $("#scrim").classList.remove("on"); sel = null; }
$("#scrim").onclick = closeSheet;

function daysPicker(id, def) {
  return `<div class="chips" data-for="${id}">${[7, 30, 90, 365].map(n => `<button class="chip${n === def ? " on" : ""}" data-n="${n}">${n}</button>`).join("")}</div>
    <input class="in lat" id="${id}" inputmode="numeric" value="${def}">`;
}
function deviceSheet(d) {
  sel = d.id;
  openSheet(`
    <div class="row g-${d.group}"><div class="nm"><bdi>${esc(d.model || d.name || "Android")}</bdi></div><span class="pill">${pill(d)}</span></div>
    <div class="ids" style="margin-bottom:14px"><div class="idb" data-c="${esc(d.id)}"><small>DEVICE</small><div class="mono">${fmtId(d.id)}</div></div>
      <div class="idb" data-c="${esc(d.activation ? d.activation.activationId : "")}"><small>VERIFICATION</small><div class="mono">${d.activation ? shortAct(d.activation.activationId) : "—"}</div></div></div>
    <div class="sec"><h4>إصدار كود لهذا الجهاز</h4>${daysPicker("cd", 30)}<button class="btn" data-a="code">إصدار</button><div id="res"></div></div>
    <div class="sec"><h4>تمديد</h4><div class="pair"><input class="in lat" id="ex" inputmode="numeric" value="30"><button class="btn ghost" data-a="extend">تمديد</button></div></div>
    <div class="sec"><h4>مدة التجربة</h4><div class="pair"><input class="in lat" id="tr" inputmode="numeric" value="${data.defaultTrialDays}"><button class="btn ghost" data-a="trial">حفظ</button></div></div>
    <div class="sec">${d.group === "blocked" ? '<button class="btn ghost" data-a="unblock">إلغاء الحظر</button>' : '<button class="btn red" data-a="block">حظر</button>'}</div>`);
}
function codeSheet() {
  openSheet(`<div class="nm" style="margin-bottom:6px">كود لأي جهاز</div>
    <div class="sec"><h4>المدة بالأيام</h4>${daysPicker("cd", 30)}<button class="btn" data-a="code">إصدار</button><div id="res"></div></div>`);
}
function settingsSheet() {
  openSheet(`<div class="nm" style="margin-bottom:6px">الإعدادات</div>
    <div class="sec"><h4>التجربة الافتراضية للأجهزة الجديدة</h4><div class="pair"><input class="in lat" id="dt" inputmode="numeric" value="${data ? data.defaultTrialDays : 3}"><button class="btn ghost" data-a="deftrial">حفظ</button></div></div>
    <div class="sec"><button class="btn ghost" data-a="logout">تسجيل الخروج</button></div>`);
}
function busy(btn, on) { if (btn) btn.disabled = on; }
function num(id) { const n = parseInt(($("#" + id) || {}).value, 10); return isNaN(n) ? -1 : n; }

$("#sheet").addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (chip) { const box = chip.parentElement; box.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c === chip)); $("#" + box.dataset.for).value = chip.dataset.n; return; }
  const cp = e.target.closest("[data-c]"); if (cp) { if (cp.dataset.c) copy(cp.dataset.c); return; }
  const b = e.target.closest("[data-a]"); if (!b) return;
  const a = b.dataset.a;
  if (a === "logout") { store.set("mtk", null); store.set("mtk2", null); store.set("mtm", null); key = null; closeSheet(); $("#login").classList.remove("hide"); return; }
  let p;
  if (a === "code") {
    const n = num("cd"); if (n < 1 || n > 3650) return toast("مدة غير صالحة");
    busy(b, true);
    return api("create_code", { deviceId: sel || "", days: n, count: 1 }).then(r => {
      const c = r.codes[0];
      $("#res").innerHTML = `<div class="out" data-c="${esc(c.code)}"><b class="mono">${esc(c.code)}</b><small>${n} يوم · انسخ</small></div>`;
      copy(c.code); load();
    }, fail).then(() => busy(b, false));
  }
  if (a === "extend") { const n = num("ex"); if (n < 1 || n > 3650) return toast("مدة غير صالحة"); p = { deviceId: sel, extendDays: n }; }
  if (a === "trial") { const n = num("tr"); if (n < 0 || n > 365) return toast("مدة غير صالحة"); p = { deviceId: sel, trialDays: n }; }
  if (a === "block") p = { deviceId: sel, blocked: true };
  if (a === "unblock") p = { deviceId: sel, blocked: false };
  if (a === "deftrial") {
    const n = num("dt"); if (n < 0 || n > 365) return toast("مدة غير صالحة");
    busy(b, true);
    return api("set_default_trial", { days: n }).then(() => { toast("تم الحفظ"); closeSheet(); load(); }, fail).then(() => busy(b, false));
  }
  if (p) { busy(b, true); api("update_device", p).then(() => { toast("تم"); closeSheet(); load(); }, fail).then(() => busy(b, false)); }
});

$("#list").addEventListener("click", e => {
  const cp = e.target.closest("[data-c]"); if (cp) { if (cp.dataset.c) copy(cp.dataset.c); return; }
  const rv = e.target.closest("[data-rv]");
  if (rv) { rv.disabled = true; api("revoke_code", { codeId: rv.dataset.rv }).then(() => { toast("تم الإلغاء"); load(); }, fail); return; }
  const c = e.target.closest(".card[data-id]");
  if (c && data) { const d = data.devices.find(x => x.id === c.dataset.id); if (d) deviceSheet(d); }
});
document.querySelectorAll(".st").forEach(el => el.onclick = () => { filter = filter === el.dataset.g ? "" : el.dataset.g; if (tab !== "dev") setTab("dev"); render(); });
function setTab(t) { tab = t; document.querySelectorAll(".seg button").forEach(b => b.classList.toggle("on", b.dataset.t === t)); render(); }
document.querySelectorAll(".seg button").forEach(b => b.onclick = () => setTab(b.dataset.t));
$("#q").addEventListener("input", render);
$("#fab").onclick = () => { sel = null; codeSheet(); };
$("#gear").onclick = settingsSheet;

function enter() {
  const v = $("#key").value.trim(); if (!v) return;
  const t = $("#tok").value.trim();
  key = v;
  if (t) { mode = "legacy"; tok = t; }
  api("overview").then(r => {
    store.set("mtk", v); store.set("mtm", mode); if (mode === "legacy") store.set("mtk2", tok);
    $("#login").classList.add("hide"); data = r; render();
  }, e => {
    const m = String(e && e.message);
    // Current server checks the API token before anything else, so the console route answers UNAUTHORIZED.
    if ((m === "UNKNOWN_ACTION" || m === "UNAUTHORIZED") && mode === "console") { $("#tok").classList.remove("hide"); $("#tok").focus(); toast("أدخل API TOKEN"); return; }
    key = null; fail(e);
  });
}
$("#enter").onclick = enter;
$("#key").addEventListener("keydown", e => { if (e.key === "Enter") enter(); });
$("#tok").addEventListener("keydown", e => { if (e.key === "Enter") enter(); });
let deferred = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; $("#install").classList.remove("hide"); });
window.addEventListener("appinstalled", () => $("#install").classList.add("hide"));
$("#install").onclick = () => { if (!deferred) return; deferred.prompt(); deferred.userChoice.finally(() => { deferred = null; $("#install").classList.add("hide"); }); };
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
if (key) { $("#login").classList.add("hide"); load(); }
setInterval(() => { if (key && !$("#sheet").classList.contains("on") && document.visibilityState === "visible") load(); }, 60000);
}
</script>
</body>
</html>
